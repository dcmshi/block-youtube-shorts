<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shorts Blocker</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #0f0f0f;
      --muted: #606060;
      --line: #e5e5e5;
      --accent: #cc0000;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #212121; --fg: #f1f1f1; --muted: #aaaaaa; --line: #3a3a3a; --accent: #ff4e45; }
    }
    body {
      margin: 0;
      width: 260px;
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.4 system-ui, sans-serif;
    }
    header { padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 14px; }
    label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 14px;
      cursor: pointer;
    }
    label small { display: block; color: var(--muted); font-size: 11.5px; }
    .main { border-bottom: 1px solid var(--line); font-weight: 600; }
    input { accent-color: var(--accent); width: 16px; height: 16px; flex: none; margin: 0; }
    body.off .options { opacity: 0.45; pointer-events: none; }
  </style>
</head>
<body>
  <header>Shorts Blocker</header>
  <label class="main">Block Shorts <input type="checkbox" id="enabled"></label>
  <div class="options">
    <label><span>Hide navigation<small>Sidebar entry and channel tab</small></span><input type="checkbox" id="nav"></label>
    <label><span>Hide Shorts shelves<small>The Shorts rows on home, search and subscriptions</small></span><input type="checkbox" id="shelves"></label>
    <label><span>Hide Shorts in lists<small>Single Shorts mixed in with regular videos</small></span><input type="checkbox" id="feed"></label>
    <label><span>Open Shorts as normal videos<small>Redirects /shorts/ links to the normal player</small></span><input type="checkbox" id="redirect"></label>
  </div>
  <script src="popup.js"></script>
</body>
</html>
